  <style>

    :root{
      --bg:#020b06;
      --bg2:#06180d;

      --green:#22c55e;
      --lime:#84cc16;
      --emerald:#10b981;
      --mint:#6ee7b7;
      --light:#ecfdf5;

      --muted:#9bb9a7;
      --line:rgba(34,197,94,.24);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      min-height:100%;
    }

    body{
      font-family:'Sora',sans-serif;
      background:var(--bg);
      color:#fff;
      overflow-x:hidden;
    }

    /* PREMIUM GREEN BACKGROUND */

    .background{
      position:fixed;
      inset:0;
      z-index:0;
      overflow:hidden;

      background:
        radial-gradient(circle at 10% 10%,rgba(34,197,94,.22),transparent 32%),
        radial-gradient(circle at 90% 85%,rgba(16,185,129,.20),transparent 36%),
        linear-gradient(135deg,#020b06,#062315,#020b06);
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(60px);
      animation:float 9s ease-in-out infinite;
    }

    .orb.one{
      width:400px;
      height:400px;
      top:-180px;
      left:-170px;
      background:rgba(34,197,94,.32);
    }

    .orb.two{
      width:430px;
      height:430px;
      bottom:-220px;
      right:-180px;
      background:rgba(16,185,129,.28);
      animation-delay:-4s;
    }

    .orb.three{
      width:230px;
      height:230px;
      top:42%;
      left:30%;
      background:rgba(132,204,22,.13);
      animation-delay:-2s;
    }

    .particles{
      position:absolute;
      inset:0;
      opacity:.16;

      background-image:
        radial-gradient(circle,rgba(220,252,231,.8) 1px,transparent 1.5px);

      background-size:48px 48px;
    }

    /* MAIN */

    .main{
      position:relative;
      z-index:5;

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:flex-start;

      padding:9vh 20px 35px;
    }

    /* CARD */

    .card{
      width:100%;
      max-width:400px;

      padding:52px 30px 42px;

      text-align:center;

      border-radius:32px;

      background:
        linear-gradient(
          145deg,
          rgba(8,45,25,.94),
          rgba(2,15,8,.98)
        );

      border:1px solid var(--line);

      backdrop-filter:blur(22px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.75),
        0 0 60px rgba(34,197,94,.10),
        inset 0 1px 0 rgba(255,255,255,.06);

      animation:fadeUp .8s cubic-bezier(.2,.8,.2,1);
    }

    /* LOGO */

    .logo-wrap{
      position:relative;

      width:140px;
      height:140px;

      margin:0 auto 30px;
    }

    .ring{
      position:absolute;
      inset:0;

      border-radius:50%;

      background:
        conic-gradient(
          var(--lime),
          var(--green),
          var(--emerald),
          var(--mint),
          var(--green),
          transparent 72%
        );

      animation:spin 7s linear infinite;

      -webkit-mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 calc(100% - 3px)
        );

      mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 calc(100% - 3px)
        );
    }

    .pulse{
      position:absolute;
      inset:-12px;

      border-radius:50%;

      border:1px solid rgba(34,197,94,.50);

      animation:pulse 2.7s ease-out infinite;
    }

    /* ROKCY LOGO */

    .ROKCY-logo{
      position:absolute;
      inset:10px;

      border-radius:50%;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      background:
        radial-gradient(
          circle at 35% 25%,
          #0b5a32,
          #02150b 72%
        );

      border:2px solid rgba(34,197,94,.45);

      box-shadow:
        inset 0 0 35px rgba(34,197,94,.18),
        0 0 35px rgba(16,185,129,.12);
    }

    .MALLIK-main{
      font-family:'Fraunces',serif;

      font-size:40px;
      font-weight:800;
      font-style:italic;

      line-height:1;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #d9f99d,
          var(--green),
          var(--emerald)
        );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .ROKCY-sub{
      margin-top:9px;

      font-size:8px;
      font-weight:800;

      letter-spacing:2.6px;

      color:#bbf7d0;
    }

    /* TEXT */

    .eyebrow{
      display:block;

      font-size:10px;
      font-weight:800;

      letter-spacing:3px;

      text-transform:uppercase;

      color:#86efac;

      margin-bottom:8px;
    }

    h1{
      font-family:'Fraunces',serif;

      font-size:34px;
      font-weight:700;

      line-height:1.12;

      letter-spacing:-.7px;

      margin-bottom:13px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #d9f99d,
          var(--green),
          var(--emerald)
        );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    h1 em{
      font-style:italic;
    }

    .tagline{
      font-size:13px;
      color:var(--muted);
      margin-bottom:28px;
    }

    /* BADGE */

    .badge{
      display:inline-flex;

      align-items:center;

      gap:8px;

      padding:9px 18px;

      border-radius:999px;

      margin-bottom:35px;

      background:
        linear-gradient(
          135deg,
          rgba(34,197,94,.13),
          rgba(16,185,129,.10)
        );

      border:1px solid rgba(34,197,94,.28);

      color:#dcfce7;

      font-family:'Fraunces',serif;

      font-size:12px;

      font-style:italic;
    }

    .badge i{
      color:var(--lime);
    }

    /* TELEGRAM BUTTON */

    .join-wrap{
      position:relative;

      padding:3px;

      border-radius:22px;

      overflow:hidden;

      background:
        linear-gradient(
          100deg,
          var(--lime),
          var(--green),
          var(--emerald),
          var(--mint),
          var(--lime)
        );

      animation:buttonGlow 2.7s ease-in-out infinite;
    }

    .join-btn{
      position:relative;

      display:flex;
      align-items:center;

      gap:14px;

      width:100%;

      padding:17px 18px;

      border-radius:19px;

      text-decoration:none;

      background:
        linear-gradient(
          100deg,
          #ecfdf5,
          #bbf7d0,
          #86efac,
          #22c55e,
          #ecfdf5
        );

      background-size:300% 100%;

      animation:gradientMove 6s ease infinite;

      overflow:hidden;

      color:#022c16;
    }

    .join-btn::after{
      content:"";

      position:absolute;

      top:0;
      left:-60%;

      width:40%;
      height:100%;

      background:
        linear-gradient(
          115deg,
          transparent,
          rgba(255,255,255,.70),
          transparent
        );

      animation:shine 2.8s ease-in-out infinite;
    }

    .icon{
      position:relative;
      z-index:2;

      width:45px;
      height:45px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      background:#022c16;

      flex-shrink:0;

      box-shadow:
        0 0 0 2px rgba(255,255,255,.35);
    }

    .icon i{
      color:var(--green);
      font-size:20px;
    }

    .button-text{
      position:relative;
      z-index:2;

      flex:1;

      text-align:left;
    }

    .small{
      display:block;

      font-size:10px;
      font-weight:800;

      letter-spacing:1.2px;

      text-transform:uppercase;

      color:rgba(2,44,22,.65);
    }

    .big{
      font-family:'Fraunces',serif;

      font-size:20px;
      font-weight:700;

      font-style:italic;

      color:#022c16;
    }

    .arrow{
      position:relative;
      z-index:2;

      font-size:16px;

      color:#022c16;
    }

    /* ADS MANAGED BY */

    .agency{
      margin-top:18px;
      text-align:center;
      font-size:12px;
      font-weight:600;
      color:#fff;
    }

    .agency a{
      color:#a855f7;
      text-decoration:underline;
    }

    /* ANIMATIONS */

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @keyframes pulse{
      0%{
        transform:scale(.9);
        opacity:.65;
      }

      100%{
        transform:scale(1.38);
        opacity:0;
      }
    }

    @keyframes gradientMove{
      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }
    }

    @keyframes shine{
      0%{
        left:-60%;
      }

      55%,100%{
        left:130%;
      }
    }

    @keyframes buttonGlow{
      0%,100%{
        box-shadow:
          0 20px 48px rgba(34,197,94,.25);
      }

      50%{
        box-shadow:
          0 25px 70px rgba(16,185,129,.45);
      }
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes float{
      0%,100%{
        transform:translate(0,0);
      }

      50%{
        transform:translate(25px,20px);
      }
    }

    @media(max-width:400px){

      .card{
        padding:44px 22px 36px;
      }

      h1{
        font-size:28px;
      }

      .ROKCY-main{
        font-size:35px;
      }

    }

  </style>
</head>
